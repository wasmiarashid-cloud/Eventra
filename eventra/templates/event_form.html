{% extends 'base.html' %}{% block content %}<div class="heading"><div><p class="eyebrow">{{ 'Update your proposal' if editing else 'Start with an idea' }}</p><h1>{{ 'Edit event request' if editing else 'New event request' }}</h1></div><a href="{{ url_for('events.dashboard') }}" class="text-button">Back to requests</a></div><section class="panel form-panel"><form method="post"><input type="hidden" name="version" value="{{ event['version'] }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="form-grid"><label class="wide">Event title<input name="title" required minlength="3" maxlength="100" value="{{ event.get('title','') if event is mapping else event['title'] }}"></label><label>Organizer type<select name="kind">{% for value,label in [('club','Student club'),('faculty','Faculty member')] %}<option value="{{ value }}" {{ 'selected' if event['kind']==value else '' }}>{{ label }}</option>{% endfor %}</select></label><label>Organizer / Requester name<input name="organizer" required minlength="2" maxlength="90" value="{{ event['organizer'] }}"></label><label class="wide">Purpose and description<textarea name="description" required minlength="10" maxlength="1500" rows="4">{{ event['description'] }}</textarea></label><label>Date<input name="date" type="date" min="{{ today }}" required value="{{ event['date'] }}"></label><label>Proposed venue<select name="venue">{% for venue in venues %}<option {{ 'selected' if event['venue']==venue else '' }}>{{ venue }}</option>{% endfor %}</select></label><label>Start time<input name="start" type="time" required value="{{ event['start'] }}"></label><label>End time<input name="end" type="time" required value="{{ event['end'] }}"></label><label>Expected attendance<input name="attendees" type="number" min="1" max="10000" required value="{{ event['attendees'] or 30 }}"></label></div><p class="field-hint">All times are in Riyadh time (UTC+3). Events must start and end on the same day.</p><div class="dialog-actions"><button class="primary">{{ 'Resubmit for review' if editing else 'Submit request' }}</button><a href="{{ url_for('events.dashboard') }}" class="secondary">Cancel</a></div></form></section>{% endblock %}
